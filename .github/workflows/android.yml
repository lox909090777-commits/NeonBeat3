
name: Build NeonBeat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Build APK
        run: gradle --no-daemon -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
