
name: Build NeonBeat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NeonBeat
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract NeonBeat 2.3.1
        run: |
          mkdir -p project
          ZIP_FILE="NeonBeat-2.3.1-Android-Project-1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found!"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          ls -la project

      - name: Check Android project
        run: |
          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find project -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found!"
            exit 1
          fi

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p project \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-2.3.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
